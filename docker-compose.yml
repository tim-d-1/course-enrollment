services:
  postgres:
    image: postgres:17-alpine
    container_name: courses_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: courses_student
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: courses_variant06_test
    volumes:
      - ./migrations/V1__create_tables.sql:/docker-entrypoint-initdb.d/V1__create_tables.sql
